# Вставить ВНУТРЬ блока server { ... listen 443 ssl ... },
# который certbot создал для 158-160-202-57.nip.io
# (обычно /etc/nginx/sites-available/default или отдельный файл сайта).
# Блок location / со статикой фронтенда оставить как есть.

location /api/ {
    proxy_pass http://127.0.0.1:3000;
    proxy_http_version 1.1;

    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    proxy_read_timeout 30s;
}
